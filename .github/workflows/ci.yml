name: CI

on:
  push:
    branches:
      - main
      - release
  pull_request:
    branches:
      - main
      - release

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    env:
      VITE_FORMSUBMIT_RECEIVER: ci@example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Logics Manager
        run: npm install --global @grifhinz/logics-manager@2.17.1

      - name: Logics docs lint
        run: logics-manager lint --require-status

      - name: Logics workflow audit (baseline, blocking)
        run: logics-manager audit --legacy-cutoff-version 1.1.0 --group-by-doc

      - name: Logics workflow audit (strict report, non-blocking)
        continue-on-error: true
        run: logics-manager audit --format json

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: E2E (production-like)
        run: npm run test:e2e
